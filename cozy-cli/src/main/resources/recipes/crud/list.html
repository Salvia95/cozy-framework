<!DOCTYPE html>
<!--/* {{L}} 목록 화면(api): list-with-filter 패턴 (cozy add crud). 검색과 페이지 이동은 result fragment만 바꾼다.
     비었을 때: 조건이 있으면 noResults(조건 지우기), 없으면 emptyStateAction({{L}} 만들기). */-->
<html th:replace="~{cozy/layout/base :: appShell('{{L}}', ~{::main})}">
<body>
<main>
  <section th:replace="~{cozy/pattern/list-with-filter :: listWithFilter('{{L}}', ~{::#{{eKebab}}-actions}, ~{::#filter}, ~{::#result})}">
    <a id="{{eKebab}}-actions" class="btn btn-primary" th:href="@{/{{module}}/new}"><svg th:replace="~{cozy/icon/tabler :: icon('plus')}"></svg>{{L}} 만들기</a>

    <form id="filter" class="row g-2 align-items-center" th:action="@{/{{module}}}" method="get" th:object="${filter}"
          th:hx-get="@{/{{module}}}" hx-target="#result" hx-swap="outerHTML" hx-push-url="true"
          hx-trigger="submit, input delay:300ms, change">
      <div class="col">
        <div class="input-icon">
          <span class="input-icon-addon"><svg th:replace="~{cozy/icon/tabler :: icon('search')}"></svg></span>
          <input class="form-control" type="search" th:field="*{q}" placeholder="{{searchLabels}} 검색" aria-label="검색">
          <span class="input-icon-addon"><span th:replace="~{cozy/component/loading :: loading()}"></span></span>
        </div>
      </div>
    </form>

    <div id="result" th:fragment="result">
      <th:block th:if="${result.rows.isEmpty()}">
        <div class="card-body" th:if="${!#strings.isEmpty(filter.q)}">
          <div th:replace="~{cozy/component/empty-state :: noResults('/{{module}}')}"></div>
        </div>
        <div class="card-body" th:unless="${!#strings.isEmpty(filter.q)}">
          <div th:replace="~{cozy/component/empty-state :: emptyStateAction('{{icon}}', '{{Ls}} 없습니다', '첫 {{Lo}} 만들어 보세요.', ~{::#empty-action})}">
            <a id="empty-action" class="btn btn-primary" th:href="@{/{{module}}/new}"><svg th:replace="~{cozy/icon/tabler :: icon('plus')}"></svg>{{L}} 만들기</a>
          </div>
        </div>
      </th:block>
      <th:block th:unless="${result.rows.isEmpty()}">
        <div th:replace="~{cozy/component/data-table :: dataTable(~{::#{{eKebab}}-head}, ~{::.{{eKebab}}-row})}">
          <table>
            <thead><tr id="{{eKebab}}-head"><th>{{nameLabel}}</th>{{headCells}}<th class="w-1">수정</th></tr></thead>
            <tbody>
              <tr class="{{eKebab}}-row" th:each="row : ${result.rows}">
                <td class="text-nowrap"><a class="text-reset fw-medium" th:href="@{/{{module}}/{id}(id=${row.id})}" th:text="${row.{{name}}}">{{nameLabel}}</a></td>{{rowCells}}
                <td class="text-secondary text-nowrap" th:text="${row.updatedAt}">2026-11-06 10:00</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div th:replace="~{cozy/component/pagination :: pagination(${result.page}, '/{{module}}', '#result', '#filter')}"></div>
      </th:block>
    </div>
  </section>
</main>
</body>
</html>
