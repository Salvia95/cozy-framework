<!DOCTYPE html>
<!--/* {{L}} 수정 화면(api): form-page 패턴 (cozy add crud). 만들기와 같은 칸({{module}}/internal/fields), 버튼은 [취소] [저장].
     경로는 {{L}} 이름 › {{L}} 수정. 바뀐 게 없으면 저장하지 않고 상세에 "바뀐 내용이 없습니다"를 알린다. */-->
<html th:replace="~{cozy/layout/base :: appShell('{{L}} 수정', ~{::main})}">
<body>
<main>
  <section th:replace="~{cozy/pattern/form-page :: formPage('{{L}} 수정', ${item.{{name}}}, '/{{module}}/' + ${item.id}, ~{::#{{e}}Form})}">
    <form id="{{e}}Form" class="card" th:fragment="{{e}}Form" th:action="@{/{{module}}/{id}(id=${item.id})}" method="post" th:object="${form}"
          th:hx-post="@{/{{module}}/{id}(id=${item.id})}" hx-target="this" hx-swap="outerHTML">
      <div th:replace="~{{{module}}/internal/fields :: {{e}}Fields()}"></div>
      <div th:replace="~{cozy/component/form-actions :: formActions('/{{module}}/' + ${item.id}, 'device-floppy', '저장')}"></div>
    </form>
  </section>
</main>
</body>
</html>
