<!DOCTYPE html>
<!--/*
  속성 표의 "화면 안의 동작" 구획. 요소마다 위치, 컴포넌트(누르면 명세, 앱 컴포넌트는 고치기 링크), 이벤트와 묶인 값, htmx 요청을 보인다.
  앱 템플릿의 요소는 여기서 붙이고 뗀다: POST /cozy/dev/workbench/attach가 cozy attach로 변경 파일을 보이고 적용한다(attachForm).
  구조 트리의 표는 선택할 때 오른쪽 칸으로 복제되므로 id를 두지 않는다. 폼은 workbenchPicker가 htmx에 알린다.
  cozyElements는 BehaviorViews.Element 목록, cozyNode는 돌아가서 다시 고를 구조의 줄(없으면 null)이다.
*/-->
<html lang="ko">
<body>
<table>
<tbody>
<th:block th:fragment="behaviorRows(cozyElements, cozyNode)">
  <tr class="cozy-workbench-props-section"><th colspan="2" scope="colgroup" th:text="|화면 안의 동작 ${cozyElements.size()}|">화면 안의 동작 2</th></tr>
  <th:block th:each="el : ${cozyElements}" th:with="b=${el.binding}">
    <tr class="cozy-workbench-behavior-start">
      <th scope="row">요소</th>
      <td><code th:text="${b.element}">&lt;div class="form-hint"&gt;</code>
        <a class="d-block" th:aria-label="|${el.location()} 소스 보기|"
           th:href="@{/cozy/dev/workbench(spec=${screen.screen},state=${state},w=${w},view='template',template=${b.template})} + '#L' + ${b.line}"><code
           th:text="${el.location()}">templates/memo/internal/fields.html:9</code></a></td>
    </tr>
    <tr th:if="${b.component != null}">
      <th scope="row">컴포넌트</th>
      <td>
        <details class="cozy-workbench-behavior-spec" th:if="${el.component != null}">
          <summary><code th:text="${b.component}">memoBodyCount</code>
            <span class="text-secondary small" th:text="${b.root} ? '· 붙인 자리' : '· 안쪽 요소'">· 붙인 자리</span></summary>
          <p class="mt-1 mb-1" th:text="${el.component.purpose}">본문을 쓰는 동안 글자 수와 한도를 보인다</p>
          <th:block th:each="section : ${el.component.sections}">
            <th:block th:if="${!section.entries.isEmpty()}">
              <span class="d-block text-secondary small mt-1" th:text="${section.title}">상태</span>
              <span class="d-block" th:each="entry : ${section.entries}"><code th:text="${entry.name}">length</code>
                <span class="text-secondary">·</span> <code th:text="${entry.text}">number@data-length</code></span>
            </th:block>
          </th:block>
        </details>
        <a class="btn btn-sm mt-1" th:if="${el.component != null and !#strings.startsWith(b.component, 'cozy')}"
           th:href="@{/cozy/dev/workbench/commands(recipe='behavior',edit=${b.component})}" th:aria-label="|${b.component} 고치기|">고치기</a>
        <th:block th:if="${el.component == null}">
          <code th:text="${b.component}">workbenchPicker</code> <span class="text-secondary small">명세 없음</span>
        </th:block>
      </td>
    </tr>
    <tr th:each="row : ${el.rows}">
      <th scope="row" th:text="${row.label}">이벤트</th>
      <td>
        <div class="cozy-workbench-behavior-row">
          <span class="cozy-workbench-behavior-text"><code th:text="${row.text}">input → count</code></span>
          <form method="post" th:if="${el.editable and row.detachable()}" th:action="@{/cozy/dev/workbench/attach}"
                th:hx-post="@{/cozy/dev/workbench/attach}" hx-headers='{"X-Cozy-Redirect": "follow"}' hx-target="#workbench-inspector" hx-select="#workbench-inspector" hx-swap="outerHTML" hx-select-oob="#workbench-side,#workbench-flash,#workbench-errors" hx-push-url="true">
            <input type="hidden" name="spec" th:value="${screen.screen}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" name="w" th:value="${w}">
            <input type="hidden" name="node" th:if="${cozyNode != null}" th:value="${cozyNode}">
            <input type="hidden" name="component" th:value="${b.component}">
            <input type="hidden" name="template" th:value="${b.template}">
            <input type="hidden" name="line" th:value="${b.line}">
            <input type="hidden" name="option" th:value="${row.option}">
            <input type="hidden" name="key" th:value="${row.key}">
            <input type="hidden" name="value" th:value="${row.value}">
            <input type="hidden" name="detach" value="true">
            <button type="submit" class="btn btn-sm" name="step" value="plan" th:aria-label="|${row.label} ${row.text} 떼기|">떼기</button>
          </form>
        </div>
      </td>
    </tr>
    <tr th:each="row : ${el.htmx}">
      <th scope="row" th:text="${row.label}">htmx</th>
      <td><code th:text="${row.text}">hx-get = /memo</code></td>
    </tr>
    <tr th:if="${el.editable}">
      <th scope="row">붙이기</th>
      <td><form th:replace="~{cozy/dev/workbench-behaviors :: attachForm(${el.component}, ${b.template}, ${b.line}, ${b.root}, ${el.currentData()}, ${cozyNode}, false)}"></form></td>
    </tr>
  </th:block>
</th:block>
</tbody>
</table>

<!--/*
  붙이기 폼: cozy attach 하나. 컴포넌트의 자리(cozyTakesData)면 컴포넌트가 읽는 data-*마다 칸이 있고, 지금 값(cozyCurrent)과 다른 것만 넘긴다.
  붙일 것 하나(이벤트, 글자, 보임, 속성, 입력값, 준비 전 숨김)와 그 이름을 고른다. 앱 컴포넌트의 이름은 선택 칸이고, 프레임워크 컴포넌트는
  인자를 받는 메서드(toggle('이름'))가 있어 글 칸이다. 속성 표에서 복제되므로 id를 두지 않는다.
  cozyFromPlace: 미리보기에서 고른 요소의 붙이기 카드에서 보냈는가(취소가 그 카드로 돌아간다).
*/-->
<form th:fragment="attachForm(cozyComponent, cozyTemplate, cozyLine, cozyTakesData, cozyCurrent, cozyNode, cozyFromPlace)"
      class="cozy-workbench-arg-form" method="post" th:action="@{/cozy/dev/workbench/attach}"
      th:hx-post="@{/cozy/dev/workbench/attach}" hx-headers='{"X-Cozy-Redirect": "follow"}' hx-target="#workbench-inspector" hx-select="#workbench-inspector" hx-swap="outerHTML" hx-select-oob="#workbench-side,#workbench-flash,#workbench-errors" hx-push-url="true">
  <input type="hidden" name="spec" th:value="${screen.screen}">
  <input type="hidden" name="state" th:value="${state}">
  <input type="hidden" name="w" th:value="${w}">
  <input type="hidden" name="node" th:if="${cozyNode != null}" th:value="${cozyNode}">
  <input type="hidden" name="component" th:value="${cozyComponent.name}">
  <input type="hidden" name="template" th:value="${cozyTemplate}">
  <input type="hidden" name="line" th:value="${cozyLine}">
  <input type="hidden" name="fromPlace" value="true" th:if="${cozyFromPlace}">
  <th:block th:if="${cozyTakesData}" th:each="field : ${cozyComponent.data}">
    <label class="d-block mb-1">
      <span class="d-block small"><code th:text="|data-${field.name}|">data-limit</code>
        <span class="text-secondary" th:text="${field.hint}">상태 limit · number@data-limit</span></span>
      <input class="form-control form-control-sm" type="text" autocomplete="off" th:name="|data.${field.name}|" th:value="${cozyCurrent.get(field.name)}"
             placeholder="값이나 ${식}">
    </label>
    <input type="hidden" th:name="|was.${field.name}|" th:value="${cozyCurrent.get(field.name)}">
  </th:block>
  <select class="form-select form-select-sm" name="option" th:aria-label="|${cozyComponent.name} 붙일 것|">
    <option value="" th:if="${cozyTakesData}">붙일 것 없음</option>
    <option value="on">이벤트</option>
    <option value="text">글자</option>
    <option value="show">보임</option>
    <option value="bind">속성</option>
    <option value="model">입력값</option>
    <option value="cloak">준비 전 숨김</option>
  </select>
  <input class="form-control form-control-sm mt-1" type="text" autocomplete="off" name="key" placeholder="이벤트나 속성 이름 (예: input)"
         th:aria-label="|${cozyComponent.name} 이벤트나 속성 이름|">
  <select class="form-select form-select-sm mt-1" name="value" th:if="${!cozyComponent.framework}" th:aria-label="|${cozyComponent.name} 이름|">
    <option value="">이름 없음 (준비 전 숨김)</option>
    <optgroup label="동작 (이벤트가 부른다)" th:if="${!cozyComponent.handlers.isEmpty()}">
      <option th:each="name : ${cozyComponent.handlers}" th:value="${name}" th:text="${name}">count</option>
    </optgroup>
    <optgroup label="상태와 계산 (글자, 보임, 속성, 입력값)" th:if="${!cozyComponent.values.isEmpty()}">
      <option th:each="name : ${cozyComponent.values}" th:value="${name}" th:text="${name}">label</option>
    </optgroup>
  </select>
  <th:block th:if="${cozyComponent.framework}">
    <input class="form-control form-control-sm mt-1" type="text" autocomplete="off" name="value" placeholder="이름 (예: toggle('filter'))"
           th:aria-label="|${cozyComponent.name} 이름|">
    <span class="d-block text-secondary small mt-1" th:text="${cozyComponent.hint()}">이벤트가 부를 이름: copy · 묶을 이름: copy</span>
  </th:block>
  <button type="submit" class="btn btn-sm mt-1" name="step" value="plan">변경 파일 확인</button>
</form>
</body>
</html>
