<!DOCTYPE html>
<!--/*
  워크벤치의 소스 보기 한 벌: 파일 경로, 안내 한 줄(없으면 빈 글자), 번호가 붙은 줄. 줄마다 id가 L{번호}여서 #L7로 그 줄에 간다.
  화면 보기의 가운데 칸(템플릿, 화면 명세, 동작 명세, 만든 JS)과 모듈 화면의 동작 소스가 쓴다. 아래의 changeDiff는 변경 파일의 바뀐 줄이다.
  cozyFile은 프로젝트 기준 경로, cozyLines는 WorkbenchController.Line 목록, cozyNote는 파일 위에 보일 안내다.
*/-->
<html lang="ko">
<body>
<th:block th:fragment="sourceLines(cozyFile, cozyLines, cozyNote)">
  <div class="card-body" th:if="${cozyFile == null or cozyLines.isEmpty()}">
    <p class="text-secondary mb-0">소스를 읽을 수 없습니다.</p>
  </div>
  <th:block th:if="${cozyFile != null and !cozyLines.isEmpty()}">
    <div class="card-body border-bottom py-2 cozy-workbench-source-path">
      <code class="small" th:text="${cozyFile}">src/main/resources/templates/memo/api/list.html</code>
      <p class="text-secondary small mb-0 mt-1" th:if="${!#strings.isEmpty(cozyNote)}" th:text="${cozyNote}">안내</p>
    </div>
    <div class="table-responsive cozy-workbench-scroll">
      <table class="table table-sm table-borderless cozy-workbench-source mb-0">
        <tbody>
          <tr th:each="line : ${cozyLines}" th:id="|L${line.number}|">
            <td class="cozy-workbench-source-number text-secondary" th:text="${line.number}">1</td>
            <td><pre class="cozy-workbench-source-text" th:text="${line.text}">소스</pre></td>
          </tr>
        </tbody>
      </table>
    </div>
  </th:block>
</th:block>

<!--/*
  변경 파일 하나의 바뀐 줄(계획일 때): 바뀐 줄과 앞뒤 세 줄, 왼쪽은 지금 파일의 줄 번호, 다음은 바뀐 뒤의 줄 번호.
  지운 줄은 −, 더한 줄은 +와 배경으로 나눈다. 색만으로 나누지 않는다. 덩어리 사이는 ⋯ 줄이다.
  cozyChange는 WorkbenchEngine.Change, cozyLive는 앱이 템플릿과 static/을 소스에서 읽는가다.
  "바로 보임"은 적용한 뒤 새로고침만으로 보이는 파일, "빌드 필요"는 앱을 다시 빌드하고 실행해야 보이는 파일이다.
*/-->
<th:block th:fragment="changeDiff(cozyChange, cozyLive)">
  <span class="cozy-workbench-when small" th:if="${cozyChange.action != 'unchanged'}"
        th:text="${cozyChange.immediate(cozyLive)} ? '바로 보임' : '빌드 필요'">바로 보임</span>
  <details class="cozy-workbench-diff" th:if="${!cozyChange.diff.isEmpty()}">
    <summary class="small" th:text="|바뀐 줄 보기 · +${cozyChange.added()} −${cozyChange.removed()}|">바뀐 줄 보기 · +2 −1</summary>
    <div class="cozy-workbench-diff-body">
      <table class="cozy-workbench-diff-table">
        <thead class="visually-hidden"><tr><th scope="col">지금 줄</th><th scope="col">바뀐 뒤 줄</th><th scope="col">내용</th></tr></thead>
        <tbody th:each="hunk, h : ${cozyChange.diff}">
          <tr class="cozy-workbench-diff-gap" th:if="${!h.first}"><td colspan="3">⋯</td></tr>
          <tr th:each="line : ${hunk.lines}" th:classappend="${line.added()} ? 'cozy-workbench-diff-add' : (${line.removed()} ? 'cozy-workbench-diff-del' : '')">
            <td class="cozy-workbench-diff-no" th:text="${line.before > 0} ? ${line.before} : ''">7</td>
            <td class="cozy-workbench-diff-no" th:text="${line.after > 0} ? ${line.after} : ''">7</td>
            <td>
              <span class="cozy-workbench-diff-mark" aria-hidden="true" th:text="${line.added()} ? '+' : (${line.removed()} ? '−' : ' ')">+</span>
              <span class="visually-hidden" th:if="${line.added() or line.removed()}" th:text="${line.added()} ? '더한 줄: ' : '지운 줄: '">더한 줄: </span>
              <pre class="cozy-workbench-diff-text" th:text="${line.text}">&lt;div x-data="memoBodyCount"&gt;</pre>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </details>
  <span class="d-block text-secondary small" th:if="${cozyChange.diffOmitted}">파일이 커서(256KB 넘음) 바뀐 줄을 보이지 않습니다.</span>
</th:block>
</body>
</html>
