<!--/* 결과가 없을 때. icon: Tabler Icons 이름. 다음 행동을 안내할 버튼이 있으면 emptyStateAction을 쓴다. */-->
<div class="empty" th:fragment="emptyState(icon, title, description)">
  <div class="empty-icon"><svg th:replace="~{cozy/icon/tabler :: icon(${icon})}"></svg></div>
  <p class="empty-title" th:text="${title}">결과가 없습니다</p>
  <p class="empty-subtitle text-secondary" th:if="${description != null}" th:text="${description}">설명</p>
</div>

<div class="empty" th:fragment="emptyStateAction(cozyIcon, cozyTitle, cozyDescription, cozyAction)">
  <div class="empty-icon"><svg th:replace="~{cozy/icon/tabler :: icon(${cozyIcon})}"></svg></div>
  <p class="empty-title" th:text="${cozyTitle}">결과가 없습니다</p>
  <p class="empty-subtitle text-secondary" th:if="${cozyDescription != null}" th:text="${cozyDescription}">설명</p>
  <div class="empty-action"><th:block th:replace="${cozyAction}"></th:block></div>
</div>
