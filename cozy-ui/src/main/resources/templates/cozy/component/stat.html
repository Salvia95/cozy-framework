<!--/* 숫자 하나를 보여 주는 작은 카드 (개요 화면). 색은 쓰지 않는다(중립 아이콘). icon: Tabler Icons 이름 */-->
<div class="card card-sm" th:fragment="stat(icon, value, label)">
  <div class="card-body">
    <div class="row align-items-center">
      <div class="col-auto">
        <span class="avatar" aria-hidden="true"><svg th:replace="~{cozy/icon/tabler :: icon(${icon})}"></svg></span>
      </div>
      <div class="col">
        <div class="h3 mb-0" th:text="${value}">0</div>
        <div class="text-secondary" th:text="${label}">항목</div>
      </div>
    </div>
  </div>
</div>
