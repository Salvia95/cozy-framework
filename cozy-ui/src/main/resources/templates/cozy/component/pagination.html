<!--/* 페이지 이동. url에 page 파라미터를 붙여 target을 htmx로 바꾼다. include는 함께 보낼 필터 폼 선택자. 번호는 CozyPage.window() */-->
<div class="card-footer d-flex align-items-center" th:fragment="pagination(page, url, target, include)">
  <p class="m-0 text-secondary">전체 <span class="fw-medium" th:text="${page.totalElements}">0</span>건</p>
  <ul class="pagination m-0 ms-auto">
    <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
      <a class="page-link" aria-label="이전 페이지" th:href="@{${url}(page=${page.previous()})}" th:hx-get="@{${url}(page=${page.previous()})}"
         th:hx-target="${target}" th:hx-include="${include}" hx-swap="outerHTML" hx-push-url="true"><svg th:replace="~{cozy/icon/tabler :: icon('chevron-left')}"></svg></a>
    </li>
    <li class="page-item" th:each="n : ${page.window()}" th:classappend="${n == page.number} ? 'active'">
      <a class="page-link" th:href="@{${url}(page=${n})}" th:hx-get="@{${url}(page=${n})}" th:text="${n}"
         th:attr="aria-current=${n == page.number} ? 'page' : null"
         th:hx-target="${target}" th:hx-include="${include}" hx-swap="outerHTML" hx-push-url="true">1</a>
    </li>
    <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
      <a class="page-link" aria-label="다음 페이지" th:href="@{${url}(page=${page.next()})}" th:hx-get="@{${url}(page=${page.next()})}"
         th:hx-target="${target}" th:hx-include="${include}" hx-swap="outerHTML" hx-push-url="true"><svg th:replace="~{cozy/icon/tabler :: icon('chevron-right')}"></svg></a>
    </li>
  </ul>
</div>
