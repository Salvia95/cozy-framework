<!--/* 모달. 여는 버튼: <button data-bs-toggle="modal" data-bs-target="#{id}">. 삭제 확인은 delete-confirm을 쓴다.
     확인 창은 모두 같은 제목 구조다: role="dialog", 제목은 h2.modal-title이고 aria-labelledby가 그 제목을 가리킨다. */-->
<div class="modal modal-blur fade" tabindex="-1" role="dialog" aria-hidden="true" th:fragment="modal(cozyId, cozyTitle, cozyBody)" th:id="${cozyId}" th:attr="aria-labelledby=${cozyId + '-title'}">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" th:id="${cozyId + '-title'}" th:text="${cozyTitle}">제목</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body"><th:block th:replace="${cozyBody}"></th:block></div>
    </div>
  </div>
</div>
