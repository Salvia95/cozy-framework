<!--/* 왼쪽 목록 + 오른쪽 상세. master의 링크가 hx-get으로 #detail을 바꾼다. */-->
<section class="container-xl py-3" th:fragment="masterDetail(cozyHeading, cozyMaster, cozyDetail)">
  <div class="page-header d-print-none mb-3"><h2 class="page-title" th:text="${cozyHeading}">목록</h2></div>
  <div class="row row-cards">
    <div class="col-md-4"><div class="card"><th:block th:replace="${cozyMaster}"></th:block></div></div>
    <div class="col-md-8"><div class="card" id="detail"><th:block th:replace="${cozyDetail}"></th:block></div></div>
  </div>
</section>
