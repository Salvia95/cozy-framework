<!--/*
  상세 보기 + 수정 폼. actions: 머리 오른쪽 버튼(삭제 등, 없으면 ~{}), detail: 읽기 화면, form: 수정 <form>.
  수정 폼의 fragment 이름은 요소 이름과 겹치지 않게 짓는다(R12, 예: memoForm).
*/-->
<th:block th:fragment="detailEdit(cozyHeading, cozyActions, cozyDetail, cozyForm)">
  <div th:replace="~{cozy/component/page-header :: pageHeader(${cozyHeading}, ${cozyActions})}"></div>
  <div class="page-body">
    <div class="container-xl">
      <div th:replace="~{cozy/component/alert :: flash()}"></div>
      <div class="row row-cards">
        <div class="col-lg-7"><div class="card">
          <div class="card-header"><h3 class="card-title">내용</h3></div>
          <div class="card-body"><th:block th:replace="${cozyDetail}"></th:block></div>
        </div></div>
        <div class="col-lg-5"><div class="card">
          <div class="card-header"><h3 class="card-title">수정</h3></div>
          <div class="card-body"><th:block th:replace="${cozyForm}"></th:block></div>
        </div></div>
      </div>
    </div>
  </div>
</th:block>
