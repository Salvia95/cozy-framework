<!--/*
  목록 + 필터 (htmx 부분 갱신). 머리(제목·동작) + 플래시 + 카드(필터 / 결과).
  filter: hx-get으로 result를 바꾸는 <form>, result: th:fragment="result"이고 id가 있는 결과 영역.
  컨트롤러는 CozyViews.pageOrFragment("{모듈}/api/list", "result")를 반환한다. 동작 버튼이 없으면 ~{}를 넘긴다.
*/-->
<th:block th:fragment="listWithFilter(cozyHeading, cozyActions, cozyFilter, cozyResult)">
  <div th:replace="~{cozy/component/page-header :: pageHeader(${cozyHeading}, ${cozyActions})}"></div>
  <div class="page-body">
    <div class="container-xl">
      <div th:replace="~{cozy/component/alert :: flash()}"></div>
      <div class="card">
        <div class="card-body border-bottom py-3"><th:block th:replace="${cozyFilter}"></th:block></div>
        <th:block th:replace="${cozyResult}"></th:block>
      </div>
    </div>
  </div>
</th:block>
