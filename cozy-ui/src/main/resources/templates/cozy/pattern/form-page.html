<!--/* 입력 폼 한 장. form: th:object가 있는 <form>. 검증 오류가 있으면 컨트롤러가 같은 화면(또는 form fragment)을 돌려준다. */-->
<section class="container-xl py-3" th:fragment="formPage(cozyHeading, cozyForm)">
  <div class="page-header d-print-none mb-3"><h2 class="page-title" th:text="${cozyHeading}">입력</h2></div>
  <div class="row"><div class="col-lg-8">
    <div class="card"><div class="card-body"><th:block th:replace="${cozyForm}"></th:block></div></div>
  </div></div>
</section>
