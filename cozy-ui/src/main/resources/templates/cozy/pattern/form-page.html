<!--/* 입력 폼 한 장. form: th:object가 있는 <form>. 검증 오류가 있으면 컨트롤러가 같은 화면(또는 form fragment)을 돌려준다. */-->
<th:block th:fragment="formPage(cozyHeading, cozyForm)">
  <div th:replace="~{cozy/component/page-header :: pageHeader(${cozyHeading}, ~{})}"></div>
  <div class="page-body">
    <div class="container-xl">
      <div th:replace="~{cozy/component/alert :: flash()}"></div>
      <div class="row row-cards"><div class="col-lg-8">
        <div class="card"><div class="card-body"><th:block th:replace="${cozyForm}"></th:block></div></div>
      </div></div>
    </div>
  </div>
</th:block>
