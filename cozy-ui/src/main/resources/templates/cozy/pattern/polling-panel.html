<!--/*
  주기 갱신 카드. url은 본문 fragment를 돌려주는 주소, seconds는 갱신 간격(초).
  본문은 카드 안에 바로 들어간다: 목록이면 list-group list-group-flush, 글이면 card-body로 감싼다.
*/-->
<div class="card" th:fragment="pollingPanel(cozyHeading, cozyUrl, cozySeconds, cozyBody)">
  <div class="card-header">
    <h3 class="card-title" th:text="${cozyHeading}">현황</h3>
    <div class="card-actions d-flex align-items-center gap-2">
      <span class="text-secondary small d-inline-flex align-items-center gap-1">
        <svg th:replace="~{cozy/icon/tabler :: icon('refresh')}"></svg><span th:text="|${cozySeconds}초마다 갱신|">10초마다 갱신</span>
      </span>
      <span th:replace="~{cozy/component/loading :: loading()}"></span>
    </div>
  </div>
  <div th:hx-get="@{${cozyUrl}}" th:hx-trigger="|every ${cozySeconds}s|" hx-swap="innerHTML" hx-indicator="closest .card">
    <th:block th:replace="${cozyBody}"></th:block>
  </div>
</div>
