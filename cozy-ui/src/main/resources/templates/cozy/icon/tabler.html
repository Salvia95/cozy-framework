<!--/*
  Tabler Icons (MIT, 3.50.0) — 가장 아래 계층(icon). layout·pattern·component와 앱 템플릿이 쓴다.
  name: tabler.io/icons의 이름. 외곽선은 icon, 채운 아이콘은 iconFilled. 글자로 쓴 이름은 규칙 R13이 확인한다.
  꾸밈용이라 aria-hidden이다. 아이콘만 있는 버튼에는 aria-label을 단다.
*/-->
<svg class="icon" aria-hidden="true" th:fragment="icon(name)"><use th:href="@{/cozy/vendor/tabler-icons/3.50.0/tabler-sprite.svg} + '#tabler-' + ${name}"></use></svg>
<svg class="icon icon-filled" aria-hidden="true" th:fragment="iconFilled(name)"><use th:href="@{/cozy/vendor/tabler-icons/3.50.0/tabler-sprite-filled.svg} + '#tabler-filled-' + ${name}"></use></svg>
