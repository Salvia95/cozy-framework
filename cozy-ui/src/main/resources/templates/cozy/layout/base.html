<!DOCTYPE html>
<!--
  Cozy 레이아웃 (PRD §6.4). 같은 파일 안의 fragment끼리만 서로 참조한다.
  - base(cozyTitle, cozyContent): 완전한 HTML 문서. head, 자산, CSRF meta, 업데이트 배너, 플래시, 푸터 버전, 토스트 자리.
  - appShell(cozyTitle, cozyContent): base + 사이드 내비. 앱 화면은 이것을 쓴다.
  화면에서 쓰는 법:
    <html th:replace="~{cozy/layout/base :: appShell('메모', ~{::main})}"> ... <main> 본문 </main> ... </html>
-->
<html lang="ko" th:fragment="base(cozyTitle, cozyContent)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0}'>
  <title th:text="${cozyApp != null} ? ${cozyTitle + ' · ' + cozyApp.name} : ${cozyTitle}">Cozy</title>
  <link rel="stylesheet" th:href="@{/cozy/vendor/pretendard/1.3.9/pretendardvariable.css}">
  <link rel="stylesheet" th:href="@{/cozy/vendor/tabler/1.7.3/css/tabler.min.css}">
  <link rel="stylesheet" th:href="@{/cozy/cozy.css}">
  <script th:src="@{/cozy/vendor/tabler/1.7.3/js/tabler.min.js}" defer></script>
  <script th:src="@{/cozy/vendor/htmx/2.0.11/htmx.min.js}" defer></script>
  <script th:src="@{/cozy/cozy.js}" defer></script>
</head>
<body>
  <div class="cozy-progress" aria-hidden="true"></div>
  <th:block th:if="${cozyUpdate != null}">
    <div class="alert alert-warning rounded-0 mb-0 cozy-update-banner" role="status">
      <span th:text="|새 버전 ${cozyUpdate.version}이 있습니다.|">새 버전이 있습니다.</span>
      <strong th:if="${cozyUpdate.required}">필수 업데이트입니다.</strong>
    </div>
  </th:block>
  <th:block th:replace="${cozyContent}"></th:block>
  <footer class="footer footer-transparent d-print-none">
    <div class="container-xl text-secondary small">
      <span th:text="${cozyApp?.name}">앱</span>
      <span th:text="${cozyApp?.version}">dev</span>
      <span>· Cozy</span>
      <span th:text="${cozyApp?.cozyVersion}">dev</span>
    </div>
  </footer>
  <div id="cozy-toasts" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>
</body>
</html>

<th:block th:fragment="appShell(cozyTitle, cozyContent)"
          th:replace="~{cozy/layout/base :: base(${cozyTitle}, ~{cozy/layout/base :: shellBody(${cozyContent})})}"></th:block>

<th:block th:fragment="shellBody(cozyShellContent)">
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <h1 class="navbar-brand navbar-brand-autodark">
          <a th:href="@{/}" th:text="${cozyApp?.name}">앱</a>
        </h1>
        <div class="navbar-collapse">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item" th:each="link : ${cozyNav}" th:classappend="${link.active} ? 'active'">
              <a class="nav-link" th:href="@{${link.path}}" th:attr="aria-current=${link.active} ? 'page' : null">
                <span class="nav-link-title" th:text="${link.label}">메뉴</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>
    <div class="page-wrapper">
      <th:block th:if="${cozyFlash != null}">
        <div class="container-xl pt-3">
          <div th:replace="~{cozy/component/alert :: alert(${cozyFlash.kind}, ${cozyFlash.message})}"></div>
        </div>
      </th:block>
      <th:block th:replace="${cozyShellContent}"></th:block>
    </div>
  </div>
</th:block>
