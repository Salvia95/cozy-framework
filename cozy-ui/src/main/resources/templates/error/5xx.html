<!DOCTYPE html>
<!--/* Boot 오류 화면 (templates/error/는 Boot 오류 화면 전용, R1·R2 예약) */-->
<html th:replace="~{cozy/layout/base :: base(|${status} 오류|, ~{::main})}">
<body>
<main class="page page-center">
  <div class="container-tight py-4">
    <div class="empty">
      <div class="empty-header" th:text="${status}">5xx</div>
      <p class="empty-title">오류가 발생했습니다</p>
      <p class="empty-subtitle text-secondary">잠시 뒤 다시 시도하세요. 계속되면 화면 메뉴의 진단 내보내기로 정보를 모아 전달해 주세요.</p>
      <div class="empty-action"><a class="btn btn-primary" th:href="@{/}">처음으로</a></div>
    </div>
  </div>
</main>
</body>
</html>
