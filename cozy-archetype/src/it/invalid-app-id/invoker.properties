# appId는 영문 소문자·숫자·하이픈 → 생성이 실패해야 한다
invoker.goals = org.apache.maven.plugins:maven-archetype-plugin:${maven-archetype-plugin.version}:generate -DinteractiveMode=false -DarchetypeCatalog=local -DarchetypeGroupId=${project.groupId} -DarchetypeArtifactId=${project.artifactId} -DarchetypeVersion=${project.version} -DgroupId=com.example -Dversion=1.0.0 -Dpackage=com.example.bad -DartifactId=bad-id -DappId=Bad_Id -Dpersistence=true -Devents=false
invoker.buildResult = failure
