# appName은 POM과 application.yml에 그대로 들어가므로 " \ < > & $ #를 막는다 → 생성이 실패해야 한다.
# (invoker는 인수의 따옴표를 벗기므로 셸 특수 문자가 아닌 #로 확인한다)
invoker.goals = org.apache.maven.plugins:maven-archetype-plugin:${maven-archetype-plugin.version}:generate -DinteractiveMode=false -DarchetypeCatalog=local -DarchetypeGroupId=${project.groupId} -DarchetypeArtifactId=${project.artifactId} -DarchetypeVersion=${project.version} -DgroupId=com.example -Dversion=1.0.0 -Dpackage=com.example.bad -DartifactId=bad-name -DappName=VOC#1 -Dpersistence=true -Devents=false
invoker.buildResult = failure
