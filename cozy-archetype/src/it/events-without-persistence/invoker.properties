# events=true, persistence=false → 생성 자체가 실패해야 한다
invoker.goals = org.apache.maven.plugins:maven-archetype-plugin:${maven-archetype-plugin.version}:generate -DinteractiveMode=false -DarchetypeCatalog=local -DarchetypeGroupId=${project.groupId} -DarchetypeArtifactId=${project.artifactId} -DarchetypeVersion=${project.version} -DgroupId=com.example -Dversion=1.0.0 -Dpackage=com.example.bad -DartifactId=bad-events -Dpersistence=false -Devents=true
invoker.buildResult = failure
