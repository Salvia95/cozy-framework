# 홈 화면 스펙 (docs/conventions/testing.md). 패턴 카탈로그 미리보기와 렌더링 검사(mvn verify)가 같이 쓴다.
# default와 empty 상태는 꼭 있어야 한다. 화면 DTO를 바꾸면 여기 fixture도 함께 고친다.
screen: home-index
template: home/index
fragments: [result, noteForm]
model:
  filter: ${package}.home.view.NoteFilter
  form: ${package}.home.view.NoteForm
  result: ${package}.home.view.HomeViews.ListResult
  activity: ${package}.home.view.HomeViews.Activity
states:
  default:
    filter: { q: "" }
    form: {}
    result:
      rows:
        - { id: 2, title: 주간 보고 정리, createdAt: "2026-11-07 10:00" }
        - { id: 1, title: 회의록, createdAt: "2026-11-07 09:00" }
    activity:
      items:
        - { message: "메모를 추가했습니다: 주간 보고 정리", at: "2026-11-07 10:00" }
  empty:
    filter: { q: 없는 단어 }
    form: {}
    result: { rows: [] }
    activity: { items: [] }
  invalid:
    filter: { q: "" }
    form: { title: "" }
    result: { rows: [] }
    activity: { items: [] }
    _errors:
      form: { title: 제목을 입력하세요 }
