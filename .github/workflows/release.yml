name: release

# 오프라인 번들을 만들고 검증해 GitHub Release 초안에 올린다 (ADR-0028).
# - 태그 vX.Y.Z push: 버전 확인 → 종단 검증 → 번들 → 오프라인 검증 → 릴리스 초안(게시는 사람이 한다)
# - 수동 실행(workflow_dispatch): 같은 빌드와 검증만 하고 번들을 실행 결과(artifact)로 남긴다. 릴리스는 만들지 않는다
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Maven 3.10.0
        run: distribution/release/install-maven.sh "$RUNNER_TEMP/maven" >> "$GITHUB_PATH"

      - name: 버전 확인
        id: version
        run: distribution/release/check-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: 배포·업데이트 종단 검증
        run: |
          mvn -v
          mvn -B -ntp -Pe2e install

      - name: 오프라인 번들
        run: distribution/offline-bundle/build-bundle.sh "$GITHUB_WORKSPACE/build/offline-bundle" "$RUNNER_TEMP/maven/apache-maven-3.10.0-bin.zip"

      - name: 오프라인 검증 (네트워크 장치 없음)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ubuntu 24.04는 권한 없는 사용자 이름공간을 AppArmor로 막는다. unshare --net --map-root-user에 필요하다
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          distribution/offline-bundle/verify-offline.sh "build/offline-bundle/cozy-offline-bundle-$VERSION.zip"

      - name: 체크섬과 릴리스 노트
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/release
          cp "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" build/release/
          (cd build/release && sha256sum "cozy-offline-bundle-$VERSION.zip" > SHA256SUMS)
          distribution/release/release-notes.sh "$VERSION" "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" > build/release/RELEASE-NOTES.md
          cat build/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cozy-offline-bundle-${{ steps.version.outputs.version }}
          path: build/release/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cozy-offline-bundle-${{ needs.bundle.outputs.version }}
          path: release

      - name: 릴리스 초안
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Cozy $VERSION" --notes-file RELEASE-NOTES.md \
            "cozy-offline-bundle-$VERSION.zip" SHA256SUMS
