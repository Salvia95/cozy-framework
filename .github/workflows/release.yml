name: release

# 오프라인 번들을 만들고 검증해 GitHub Release 초안에 올린다.
# - 번들은 둘이다: JDK 없는 번들과, Temurin JDK를 담은 Windows x64 번들. JDK를 담았으므로 그 소스 묶음도 함께 올린다
# - Windows 러너가 Windows x64 번들로 MSI를 만들고 설치·사용·제거를 확인한다
# - 태그 vX.Y.Z push: 버전 확인 → 종단 검증 → 번들 → 오프라인 검증 → 릴리스 초안(게시는 사람이 한다)
# - 수동 실행(workflow_dispatch): 같은 빌드와 검증만 하고 번들과 MSI를 실행 결과(artifact)로 남긴다. 릴리스는 만들지 않는다
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Maven 3.10.0
        run: distribution/release/install-maven.sh "$RUNNER_TEMP/maven" >> "$GITHUB_PATH"

      - name: 버전 확인
        id: version
        run: distribution/release/check-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: 배포·업데이트 종단 검증
        run: |
          mvn -v
          mvn -B -ntp -Pe2e install

      - name: 오프라인 번들
        run: distribution/offline-bundle/build-bundle.sh "$GITHUB_WORKSPACE/build/offline-bundle" "$RUNNER_TEMP/maven/apache-maven-3.10.0-bin.zip"

      - name: JDK 번들 (Windows x64, 검증용 Linux x64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          distribution/offline-bundle/add-jdk.sh "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" windows-x64
          distribution/offline-bundle/add-jdk.sh "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" linux-x64
          distribution/release/jdk-sources.sh build/jdk-sources

      - name: 오프라인 검증 (네트워크 장치 없음)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ubuntu 24.04는 권한 없는 사용자 이름공간을 AppArmor로 막는다. unshare --net --map-root-user에 필요하다
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          distribution/offline-bundle/verify-offline.sh "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" build/check
          rm -rf build/check
          # 번들 JDK: 시스템 JDK를 막은 상태에서 설치·생성·빌드·패키징이 모두 번들의 JDK로 돈다
          distribution/offline-bundle/verify-offline.sh "build/offline-bundle/cozy-offline-bundle-$VERSION-linux-x64.zip" build/check-jdk
          rm -rf build/check-jdk

      - name: 체크섬
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/release
          cp "build/offline-bundle/cozy-offline-bundle-$VERSION.zip" "build/offline-bundle/cozy-offline-bundle-$VERSION-windows-x64.zip" \
            build/jdk-sources/*.tar.gz build/release/
          (cd build/release && sha256sum "cozy-offline-bundle-$VERSION.zip" "cozy-offline-bundle-$VERSION-windows-x64.zip" *.tar.gz > SHA256SUMS)
          cat build/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cozy-offline-bundle-${{ steps.version.outputs.version }}
          path: build/release/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # MSI: 같은 실행의 Windows x64 번들을 cozy install로 펼쳐 WiX로 묶고, 같은 러너에서 설치부터 제거까지 확인한다
  windows:
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cozy-offline-bundle-${{ needs.bundle.outputs.version }}
          path: build/bundle

      - name: 번들 체크섬 확인
        shell: pwsh
        run: |
          $name = "cozy-offline-bundle-$env:VERSION-windows-x64.zip"
          $expected = (Get-Content build\bundle\SHA256SUMS | Where-Object { $_ -match "  $([regex]::Escape($name))$" }) -replace '  .*$', ''
          $actual = (Get-FileHash -Algorithm SHA256 "build\bundle\$name").Hash.ToLowerInvariant()
          if (-not $expected -or $expected -ne $actual) { throw "SHA-256이 다릅니다: $name ($actual, SHA256SUMS: $expected)" }

      - name: WiX Toolset 7.0.1 (OSMF EULA v1.1, 레포 주인 동의)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7

      - name: MSI 만들기
        shell: powershell
        run: distribution\msi\build-msi.ps1 -Bundle "build\bundle\cozy-offline-bundle-$env:VERSION-windows-x64.zip" -Output build\msi

      - name: MSI 검증 (설치 → 앱 생성·빌드·패키징 → 제거 → 컴퓨터별 설치 거부)
        shell: powershell
        run: distribution\msi\verify-msi.ps1 -Msi "build\msi\cozy-$env:VERSION-windows-x64.msi" -Work build\msi-check

      - name: MSI 체크섬
        shell: pwsh
        run: |
          $name = "cozy-$env:VERSION-windows-x64.msi"
          $hash = (Get-FileHash -Algorithm SHA256 "build\msi\$name").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD\build\msi\$name.sha256", "$hash  $name`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cozy-msi-${{ needs.bundle.outputs.version }}
          path: |
            build/msi/*.msi
            build/msi/*.msi.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: msi-logs-${{ needs.bundle.outputs.version }}
          path: build/msi-check/*.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: [bundle, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cozy-offline-bundle-${{ needs.bundle.outputs.version }}
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cozy-msi-${{ needs.bundle.outputs.version }}
          path: release

      - name: 체크섬, 릴리스 노트, 릴리스 초안
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          sha256sum -c "cozy-$VERSION-windows-x64.msi.sha256"
          cat "cozy-$VERSION-windows-x64.msi.sha256" >> SHA256SUMS
          rm "cozy-$VERSION-windows-x64.msi.sha256"
          "$GITHUB_WORKSPACE/distribution/release/release-notes.sh" "$VERSION" . > RELEASE-NOTES.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Cozy $VERSION" --notes-file RELEASE-NOTES.md \
            "cozy-$VERSION-windows-x64.msi" "cozy-offline-bundle-$VERSION.zip" "cozy-offline-bundle-$VERSION-windows-x64.zip" \
            ./*.tar.gz SHA256SUMS
