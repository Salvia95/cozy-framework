name: msi-dev

# 개발용(msi-installer 브랜치에서만): 이전 실행의 Windows x64 번들에 이 브랜치의 cozy 스크립트를 덮어 MSI를 만들고 검증한다.
# 합치기 전에 지운다. 릴리스에서는 release.yml의 windows 작업이 같은 실행에서 만든 번들로 한다.
on:
  push:
    branches: [msi-installer]

permissions:
  contents: read
  actions: read

jobs:
  args:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: 인수 전달 진단 (공백·한글·점이 있는 인수)
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'args'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content -Encoding UTF8 (Join-Path $d 'echo.ps1') -Value '$i = 0; foreach ($a in $args) { Write-Host "  [$i] <$a>"; $i++ }'
          Set-Content -Encoding ASCII (Join-Path $d 'echo.cmd') -Value "@echo off`r`n:loop`r`nif `"%~1`"==`"`" goto :eof`r`necho   cmd arg ^<%1^>`r`nshift`r`ngoto loop"
          Set-Content -Encoding ASCII (Join-Path $d 'forward.cmd') -Value "@powershell -NoProfile -ExecutionPolicy Bypass -File `"%~dp0echo.ps1`" %*"
          $sample = @('new', '-B', '-DgroupId=com.example', '-DappName=설치 확인', '-Dpersistence=true')
          Write-Host '1. PowerShell -> .cmd(%*로 출력)'
          & (Join-Path $d 'echo.cmd') @sample
          Write-Host '2. PowerShell -> .cmd -> powershell -File'
          & (Join-Path $d 'forward.cmd') @sample
          Write-Host '3. powershell -File 안에서 받은 $args를 .cmd로 다시 (@args 펼치기)'
          Set-Content -Encoding UTF8 (Join-Path $d 'relay.ps1') -Value ('$rest = @($args[1..($args.Count - 1)]); & "' + (Join-Path $d 'echo.cmd') + '" @rest')
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $d 'relay.ps1') @sample

  msi:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 번들 받기 (이전 실행) + 이 브랜치의 cozy 스크립트
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43238362524 -n cozy-offline-bundle-1.3.0-SNAPSHOT -D build\bundle -R $env:GITHUB_REPOSITORY
          $name = 'cozy-offline-bundle-1.3.0-SNAPSHOT-windows-x64'
          New-Item -ItemType Directory -Force -Path "build\overlay\$name" | Out-Null
          Copy-Item distribution\offline-bundle\cozy, distribution\offline-bundle\cozy.cmd, distribution\offline-bundle\cozy.ps1 "build\overlay\$name\"
          Push-Location build\overlay
          7z u -tzip "..\bundle\$name.zip" "$name\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 실패 $LASTEXITCODE" }
          Pop-Location

      - name: WiX Toolset 7.0.1
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7

      - name: MSI 만들기
        shell: powershell
        run: distribution\msi\build-msi.ps1 -Bundle build\bundle\cozy-offline-bundle-1.3.0-SNAPSHOT-windows-x64.zip -Output build\msi

      - name: MSI 검증 (설치 → 앱 생성·빌드·패키징 → 제거 → 컴퓨터별 설치 거부)
        shell: powershell
        run: distribution\msi\verify-msi.ps1 -Msi (Get-ChildItem build\msi\*.msi | Select-Object -First 1).FullName -Work build\msi-check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: msi-dev
          path: |
            build/msi/*.msi
            build/msi-check/*.log
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
