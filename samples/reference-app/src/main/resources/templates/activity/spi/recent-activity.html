<!--/* activity 공개 fragment: 최근 활동 목록. */-->
<div th:fragment="recentActivity(items)">
  <th:block th:if="${items.isEmpty()}">
    <div th:replace="~{cozy/component/empty-state :: emptyState('활동이 없습니다', '메모를 만들면 여기에 기록됩니다.')}"></div>
  </th:block>
  <ul class="list-unstyled mb-0" th:unless="${items.isEmpty()}">
    <li class="py-1" th:each="item : ${items}">
      <span th:text="${item.message}">메모를 만들었습니다</span>
      <span class="text-secondary small ms-2" th:text="${item.at}">2026-11-06 10:00</span>
    </li>
  </ul>
</div>
