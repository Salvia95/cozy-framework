<!DOCTYPE html>
<!--/* 메모 만들기 화면(api): form-page 패턴 + memo/internal/fields 조각 + 오른쪽 아래 [취소] [메모 만들기].
     검증 오류면 htmx가 memoForm fragment만 바꾸고(첫 오류 칸으로 포커스), 성공하면 상세로 이동한다(PRG). */-->
<html th:replace="~{cozy/layout/base :: appShell('메모 만들기', ~{::main})}">
<body>
<main>
  <section th:replace="~{cozy/pattern/form-page :: formPage('메모 만들기', '메모', '/memo', ~{::#memoForm})}">
    <form id="memoForm" class="card" th:fragment="memoForm" th:action="@{/memo}" method="post" th:object="${form}"
          th:hx-post="@{/memo}" hx-target="this" hx-swap="outerHTML">
      <div th:replace="~{memo/internal/fields :: memoFields()}"></div>
      <div th:replace="~{cozy/component/form-actions :: formActions('/memo', 'plus', '메모 만들기')}"></div>
    </form>
  </section>
</main>
</body>
</html>
