<!DOCTYPE html>
<!--/*
  메모 상세 화면(api): details 패턴(읽기 전용). 경로 메모 › 제목, 머리 오른쪽에 [삭제(확인 창)] [수정(주 버튼)].
  본문은 넓은 칸, 상태와 시각은 옆 칸(datagrid). 수정은 /memo/{id}/edit 화면에서 한다.
*/-->
<html th:replace="~{cozy/layout/base :: appShell(${memo.title}, ~{::main})}">
<body>
<main>
  <section th:replace="~{cozy/pattern/details :: details(${memo.title}, '메모', '/memo', ~{::#memo-actions}, ~{::#memo-body})}">
    <div id="memo-actions" class="btn-list">
      <th:block th:replace="~{cozy/component/delete-confirm :: deleteConfirm('memo-delete', '메모', ${memo.title}, '/memo/' + ${memo.id} + '/delete')}"></th:block>
      <a class="btn btn-primary" th:href="@{/memo/{id}/edit(id=${memo.id})}"><svg th:replace="~{cozy/icon/tabler :: icon('pencil')}"></svg>수정</a>
    </div>

    <div id="memo-body" class="row row-cards">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header"><h3 class="card-title">본문</h3></div>
          <div class="card-body">
            <th:block th:if="${memo.bodyLines.isEmpty()}"><p class="text-secondary mb-0">본문이 없습니다.</p></th:block>
            <p class="mb-2" th:each="line : ${memo.bodyLines}" th:text="${line}">본문</p>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header"><h3 class="card-title">정보</h3></div>
          <div class="card-body">
            <div class="datagrid">
              <div class="datagrid-item">
                <div class="datagrid-title">상태</div>
                <div class="datagrid-content">
                  <th:block th:if="${memo.pinned}"><span th:replace="~{cozy/component/badge :: badge('고정', 'neutral')}"></span></th:block>
                  <span class="text-secondary" th:unless="${memo.pinned}">고정 안 함</span>
                </div>
              </div>
              <div class="datagrid-item">
                <div class="datagrid-title">만든 시각</div>
                <div class="datagrid-content" th:text="${memo.createdAt}">2026-11-06 10:00</div>
              </div>
              <div class="datagrid-item">
                <div class="datagrid-title">수정한 시각</div>
                <div class="datagrid-content" th:text="${memo.updatedAt}">2026-11-06 10:00</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
