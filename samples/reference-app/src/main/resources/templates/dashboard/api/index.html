<!DOCTYPE html>
<!--/* 대시보드 화면(api): overview 패턴. 숫자 카드는 memo의 spi fragment, 최근 활동은 activity의 spi fragment를 polling-panel로 감싼다. */-->
<html th:replace="~{cozy/layout/base :: appShell('대시보드', ~{::main})}">
<body>
<main>
  <section th:replace="~{cozy/pattern/overview :: overview('대시보드', ~{::#dashboard-actions}, ~{::#memo-summary}, ~{::#activity-panel})}">
    <a id="dashboard-actions" class="btn btn-primary" th:href="@{/memo/new}"><svg th:replace="~{cozy/icon/tabler :: icon('plus')}"></svg>새 메모</a>
    <div id="memo-summary">
      <div th:replace="~{memo/spi/summary :: memoSummary(${dashboard.memo})}"></div>
    </div>
    <div id="activity-panel">
      <div th:replace="~{cozy/pattern/polling-panel :: pollingPanel('최근 활동', '/dashboard/activity', 10, ~{::#activity})}">
        <div id="activity" th:fragment="activity">
          <div th:replace="~{activity/spi/recent-activity :: recentActivity(${dashboard.activities})}"></div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
