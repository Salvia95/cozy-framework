# 메모 목록 화면 스펙. 패턴 카탈로그 미리보기와 cozy-test 렌더링 검사가 같이 쓴다.
screen: memo-list
template: memo/api/list
title: 메모 목록
fragments: [result]
model:
  filter: io.salvia95.cozy.reference.memo.api.dto.MemoFilter
  result: io.salvia95.cozy.reference.memo.api.dto.MemoViews.ListResult
states:
  default:
    filter: { q: "", pinned: false }
    result:
      rows:
        - { id: 1, title: 회의록 정리, pinned: true, updatedAt: "2026-11-06 10:00" }
        - { id: 2, title: 주간 보고, pinned: false, updatedAt: "2026-11-05 17:20" }
      page: { number: 1, size: 10, totalElements: 2 }
  empty:
    filter: { q: "", pinned: false }
    result:
      rows: []
      page: { number: 1, size: 10, totalElements: 0 }
  noResults:
    filter: { q: 없는 단어, pinned: false }
    result:
      rows: []
      page: { number: 1, size: 10, totalElements: 0 }
  paged:
    filter: { q: 메모, pinned: true }
    result:
      rows:
        - { id: 11, title: 메모 11, pinned: true, updatedAt: "2026-11-06 09:00" }
      page: { number: 2, size: 10, totalElements: 11 }
