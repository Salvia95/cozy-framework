# 메모 만들기 (form-page 패턴)
screen: memo-form
template: memo/api/form
fragments: [memoForm]
model:
  form: io.salvia95.cozy.reference.memo.api.dto.MemoForm
states:
  default:
    form: { title: 회의록 정리, body: "첫 줄\n둘째 줄", pinned: true }
  empty:
    form: {}
  invalid:
    form: { title: "", body: "" }
    _errors:
      form: { title: 제목을 입력하세요 }
